databases:
  - name: autoledger-db
    plan: free
    databaseName: autoledger
    user: autoledger

services:
  - type: web
    name: autoledger-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoledger-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"

  - type: web
    name: autoledger-admin-dashboard
    runtime: static
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://autoledger-backend.onrender.com
